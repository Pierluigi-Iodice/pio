description = "Save the last on-screen review to a versioned handoff file"
prompt = """
<objective>
Save the review shown on screen to a versioned handoff file. The version number is determined by counting existing files — never overwrites a previous review.
</objective>

<process>
1. Read `pio/STATUS.md` to determine the current step.
2. Match the step to the file family:
   - "plan review shown"  → review_plan_v*.md
   - "code review shown"  → review_code_v*.md
   - "test plan shown"    → test_plan.md (not versioned)
   - "test review shown"  → test_review_v*.md
   - No recognized step: tell the user "Nothing to accept." Stop.
3. For versioned families: list existing files in pio/handoff/ matching the pattern. Next version = count + 1.
4. Write the full review content to the determined file.
5. Update pio/STATUS.md:
   - Change ONLY the **Step:** and **Last updated:** lines.
   - Append to Session Log: `- [YYYY-MM-DD HH:MM] **[role]** ([agent]): /pio:accept → wrote [filename]`
6. Tell the user which file was written and what to run next.
</process>

<constraints>
- Never overwrite an existing review file — always increment the version.
- Only update Phase/Step/Last updated in STATUS.md. Never overwrite the Session Log.
</constraints>
"""
