description = "Apply the latest unprocessed plan review to plan.md"
prompt = """
<objective>
Act as the Planner. Find the latest review_plan_v*.md not yet logged as processed. Apply it to plan.md and log which version was used — preventing duplicate processing across agents.
</objective>

<process>
1. Read pio/roles/planner.md
2. Read pio/STATUS.md — scan the Session Log for lines containing "applyreview" to see which review_plan_v*.md files have already been processed.
3. List all review_plan_v*.md files in pio/handoff/.
4. Identify the latest unprocessed review (highest version not yet in the log).
   - If all already processed: tell the user "No new review to apply. Run /pio:review for a new cycle." Stop.
5. Read the identified review file and pio/handoff/plan.md (note current version).
6. Apply Critical Issues (or flag for PM if scope decision needed).
7. Apply Minor Issues (or note why skipped).
8. Ask PM about Open Questions before proceeding.
9. Rewrite plan.md with changes. Increment version in header.
10. Report: what changed, skipped, needs PM discussion.
11. Update pio/STATUS.md:
    - Change ONLY **Step:** and **Last updated:**
    - Append to Session Log: `- [YYYY-MM-DD HH:MM] **Planner** ([agent]): /pio:applyreview — applied [review filename] → plan.md v[N]. [1-line summary]`
</process>

<constraints>
- Never reprocess a review already in the Session Log.
- Only update Phase/Step/Last updated in STATUS.md. Append to log — never overwrite it.
</constraints>
"""
