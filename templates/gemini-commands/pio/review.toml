description = "Review pio/handoff/plan.md as Reviewer and show analysis on screen"
prompt = """
<objective>
Act as the Reviewer. Read the plan with a fresh perspective and produce a structured review. Show it on screen — do not write to disk until the user runs /pio:accept.
</objective>

<process>
1. Read `pio/roles/reviewer.md` — load your Reviewer role definition.
2. Read `pio/handoff/plan.md`
   - If missing: tell the user "No plan found. Have the Planner run `/pio:plan` first." Stop.
3. Analyze the plan as an independent reviewer with no bias toward the author.
4. Show analysis on screen — do NOT write any file yet.

   Format your output exactly as:

   ## Review Summary
   [1-2 sentence overall assessment]

   ## Critical Issues
   [Must-fix before proceeding — numbered list, or "None"]

   ## Minor Issues
   [Should-fix suggestions — numbered list, or "None"]

   ## Open Questions
   [Ambiguities that need PM decision — numbered list, or "None"]

   ## Recommendation
   APPROVED / APPROVED WITH CHANGES / REQUIRES REWORK

5. Update `pio/STATUS.md`:
   - Change ONLY **Step:** and **Last updated:**
   - Set Step = "plan review shown — awaiting /pio:accept"
   - Append to Session Log: `- [YYYY-MM-DD HH:MM] **Reviewer** ([agent]): /pio:review — plan review shown. [recommendation from step 4]`
6. Tell the user: "Review complete. Discuss with your team, then run `/pio:accept` to save it."
</process>

<constraints>
- Do NOT write review_plan.md or any handoff file at this stage.
- Only update Step/Last updated in STATUS.md. Append to Session Log — never overwrite it.
</constraints>
"""
