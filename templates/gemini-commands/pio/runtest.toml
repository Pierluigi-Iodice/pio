description = "Execute test_plan.md scenarios and write test_results.md"
prompt = """
<objective>
Act as the Tester. Execute every scenario in the test plan, record the outcome of each, and write the results to test_results.md.
</objective>

<process>
1. Read `pio/handoff/test_plan.md`
   - If missing: tell the user "No test plan found. Run `/pio:testplan` and then `/pio:accept` first." Stop.
2. Execute each test scenario in the plan.
3. For each test, record:
   - Scenario name / ID
   - Steps taken
   - Actual result
   - Verdict: PASS / FAIL / BLOCKED (and reason if not PASS)
4. Write `pio/handoff/test_results.md` using the template at `pio/handoff/test_results.md.template`.
5. Update `pio/STATUS.md`:
   - Change ONLY **Step:** and **Last updated:**
   - Set Step = "test_results.md written — awaiting /pio:reviewtest from Reviewer"
   - Append to Session Log: `- [YYYY-MM-DD HH:MM] **Tester** ([agent]): /pio:runtest — wrote test_results.md. [X pass, Y fail, Z blocked]`
6. Tell the user: "Tests complete. Switch to your Reviewer agent and run `/pio:reviewtest`"
</process>

<constraints>
- Record every scenario — do not skip any, even if the result is PASS.
- If a test cannot be executed, mark it BLOCKED with an explanation, do not skip it silently.
- Only update Step/Last updated in STATUS.md. Append to Session Log — never overwrite it.
</constraints>
"""
