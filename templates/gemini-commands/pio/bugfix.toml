description = "Fix FAIL and REGRESSION items from the latest unprocessed test review"
prompt = """
<objective>
Act as the Coder. Find the latest test_review_v*.md not yet in the Session Log. Fix regressions first, then failures.
</objective>

<process>
1. Read pio/STATUS.md — scan Session Log for "pio:bugfix" entries to find processed test_review_v*.md files.
2. List all test_review_v*.md in pio/handoff/.
3. Identify latest unprocessed. If all processed: tell user to run /pio:runtest for new results. Stop.
4. Fix all REGRESSION items first (highest priority), then FAIL items.
5. Append "Bug Fix Log" to pio/handoff/dev_log.md:
   - Source file, each item fixed, anything not fixable.
6. Update pio/STATUS.md:
   - Change ONLY **Step:** and **Last updated:**
   - Append to Session Log: `- [YYYY-MM-DD HH:MM] **Coder** ([agent]): /pio:bugfix — applied [review filename]. [1-line summary]`
7. Tell user: re-run /pio:runtest to verify.
</process>

<constraints>
- Never reprocess a review already in the Session Log.
- Always append to dev_log.md — never overwrite.
- Only update Phase/Step/Last updated in STATUS.md. Never overwrite Session Log.
</constraints>
"""
