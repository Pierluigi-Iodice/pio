description = "Archive the completed session and reset PIO for the next feature"
prompt = """
<objective>
Archive all session handoff files (current versions and all versioned backups) for the completed feature, then reset pio/STATUS.md to the initial state so PIO is ready for the next feature.
</objective>

<process>
1. Read `pio/STATUS.md` for the feature name.
2. Create the archive directory: `pio/archive/[YYYY-MM-DD_feature-name]/`
   - Use today's date and a slug derived from the feature name.
3. Move the following files from `pio/handoff/` into the archive directory (skip silently if not present):
   - `plan.md` and all `plan_v*.md` backups
   - `review_plan.md` and all `review_plan_v*.md` backups
   - `dev_log.md`
   - `review_code.md` and all `review_code_v*.md` backups
   - `test_plan.md`
   - `test_results.md`
   - `test_review.md` and all `test_review_v*.md` backups
   - `greenlight.md`
4. Do NOT move or touch these files — they are permanent install artifacts:
   - `pio/handoff/README.md`
   - `pio/handoff/*.template`
5. Reset `pio/STATUS.md` to the initial blank state:
   - Phase = IDLE
   - Step = "Run /pio:plan to begin"
   - Clear Feature field
   - Keep Role Assignment section intact
   - Replace Session Log content with `*(no entries yet)*`
6. Tell the user: "Session archived at `pio/archive/[folder-name]/`. PIO is ready for the next feature. Run `/pio:plan` to start."
</process>

<constraints>
- Move ALL files: flat names AND all versioned backups (_v1, _v2...).
- Never delete pio/handoff/README.md or any *.template file.
- Never overwrite existing archive folders — if the folder already exists, append a counter suffix (e.g., _2).
</constraints>
"""
